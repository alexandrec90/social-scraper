name: PR Gate

on:
  push:
    branches: [main]
  pull_request:
  # Re-runnable by hand. Cheap to have, and the only way to re-gate a commit whose
  # run was cancelled by the concurrency rule below.
  workflow_dispatch:

# Least privilege. Every job here only reads the repo; a job that needs more must opt
# in with its own `permissions:` block rather than inherit a permissive repo default.
permissions:
  contents: read

# A new push to a PR supersedes the in-flight run for that ref. Keyed on the ref, not
# the workflow alone, so a PR run (refs/pull/N/merge) and a main run
# (refs/heads/main) never cancel each other.
#
# `cancel-in-progress` is deliberately conditional: cancelling a superseded PR run
# saves minutes on a commit nobody will merge, but cancelling a push run would throw
# away the only CI signal that commit will ever get — and the Dependabot merge job
# gates on `workflow_run.conclusion == 'success'`, which a cancelled run never
# reports, so every bot PR would sit unmerged behind a run that was cancelled rather
# than failed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Three jobs at once, never more: the account shares about twenty runners across every
# repo. `Lint` carries every check that is not a test (the drift check, the pre-commit
# hooks, the linters), each its own step so a red one still names itself; the suite is
# two `Tests` shards; `E2E` waits for `Lint`, so it takes the third runner only once
# `Lint` has given it back.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # devkit is checked out first, for the drift check, and removed straight after it:
      # left in the workspace it is an untracked directory the linters below would scan.
      - name: Check out devkit
        uses: actions/checkout@v7
        with:
          repository: alexandrec90/devkit
          # Pin a tag, never @main — one bad devkit commit must not redden every
          # consuming repo at once.
          ref: v0.11.102
          path: .devkit-src
      # Not `./.github/actions/setup-python-env` yet: `sync-devkit.py` is stdlib-only by
      # contract precisely so the drift check can run before any environment exists, and
      # running it under the synced project would hide a third-party import creeping in.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Drift check
        # DEVKIT_DIR must be set: it is what the checkout step above exists to provide.
        # Unset, this exits 0 with "nothing to do (skipping)" before the project has
        # pulled — correct, nothing is vendored yet — and fails loudly once DEVKIT_VERSION
        # exists. If the skip line ever appears in this job's log, fix the wiring.
        env:
          DEVKIT_DIR: ${{ github.workspace }}/.devkit-src
        run: python scripts/sync-devkit.py --check
      # Every step from here runs whatever the drift check said (`!cancelled()`), so one
      # red step never hides another's verdict; each after the sync needs the sync.
      - name: Remove the devkit checkout
        if: ${{ !cancelled() }}
        run: rm -rf .devkit-src
      - id: env
        if: ${{ !cancelled() }}
        uses: ./.github/actions/setup-python-env
        with:
          # Explicit at every call site: the action is copied from devkit verbatim
          # rather than rendered, so its own default cannot know this project's version.
          python-version: "3.12"
      - name: Run every hook over the whole repo
        # The same hooks `.pre-commit-config.yaml` runs locally, so a contributor who has
        # not run `pre-commit install` cannot land what the gate would have caught.
        # `--all-files` rather than the staged diff: on a push there is no staged diff.
        # NB this includes devkit's `devkit-drift` hook, which byte-compares the vendored
        # harness against the devkit rev pinned in `.pre-commit-config.yaml` — a second,
        # independent check on top of the drift step above, which uses `sync-devkit.py`
        # against the tag pinned in this file. They can disagree, and when they do the
        # two pins have drifted apart, which is worth knowing.
        if: ${{ !cancelled() && steps.env.outcome == 'success' }}
        run: uv run pre-commit run --all-files --show-diff-on-failure
      - name: Install actionlint and dotenv-linter
        # Fail loudly, no `|| true`: `lint-all.py` degrades a missing linter to a
        # terminal note by design, so a silently skipped install here would leave the
        # workflow files and `.env.example` unchecked while the job still reported
        # green for them. The same installers `.claude/hooks/session-start.sh` uses,
        # so the gate and a local session check the same way. NB actionlint's
        # installer takes positional args ([[VERSION] DIR]) and no -b flag;
        # dotenv-linter's takes -b.
        id: linters
        if: ${{ !cancelled() && steps.env.outcome == 'success' }}
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
            | bash -s -- latest /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/dotenv-linter/dotenv-linter/master/install.sh \
            | sh -s -- -b /usr/local/bin
      - name: Lint
        if: ${{ !cancelled() && steps.linters.outcome == 'success' }}
        run: uv run python scripts/lint-all.py
      - name: Upload lint artifact
        # The filtered artifact, not the raw job log: a raw log buries the real
        # error under container-boot noise and wastes an agent's context.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-errors
          path: logs/lint-errors.log
          if-no-files-found: ignore

  test:
    name: Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      # One shard's red says nothing about another's, and all belong in one verdict.
      fail-fast: false
      matrix:
        # Two shards of equal measured length, the harness hook tests riding in `rest`.
        # Measured 2026-11-26 from a run's junit times: tests/test_runner.py 131 s alone;
        # every other file 87 s together (tests/test_cycle.py 56 s, tests/test_cli.py
        # 20 s, no other file over 2 s); the hook tests 44-56 s. Jobs: runner 167 s, rest
        # 172 s. So `runner` takes test_runner.py and `rest` every other file plus the
        # hook tests -- a new test file lands in `rest` with no edit here. If `rest`
        # outgrows `runner`, move tests/test_cycle.py across.
        # tests/test_pr_gate_shards.py fails if a file runs in no shard or two, a named
        # shard's file is gone, or the hook tests leave `rest`.
        shard: [runner, rest]
    services:
      db:
        # The same official image, from Google's mirror: a runner pulls anonymously on
        # a shared IP, and both Docker Hub and ECR Public answered `toomanyrequests`,
        # failing this job before any test ran. tests/test_workflow_images.py keeps
        # them out of CI.
        image: mirror.gcr.io/library/postgres:18
        env:
          POSTGRES_USER: social_scraper
          POSTGRES_PASSWORD: social_scraper_local_dev # pragma: allowlist secret
          POSTGRES_DB: social_scraper
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # CI always talks to the service container on its conventional port — the
      # slot offsets in ports.toml exist to deconflict LOCAL stacks, and have no
      # meaning on a runner where this job is the only thing running.
      # The `pragma` below must stay on the same line as the value — detect-secrets matches
      # its allowlist comment per-line, so a comment above the finding does nothing. These
      # are the credentials of a service container that lives for one job.
      DATABASE_URL: postgresql+psycopg://social_scraper:social_scraper_local_dev@127.0.0.1:5432/social_scraper # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v7
      - id: env
        uses: ./.github/actions/setup-python-env
        with:
          # Explicit at every call site: the action is copied from devkit verbatim
          # rather than rendered, so its own default cannot know this project's version.
          python-version: "3.12"
      - name: Application suite (this shard's files)
        # `--only`: the named files and nothing else, so the contract tests run once,
        # in whichever shard holds them, rather than in both.
        run: printf '%s\n' tests/test_*.py | awk '$0 == "tests/test_${{ matrix.shard }}.py" || "${{ matrix.shard }}" == "rest" && $0 != "tests/test_runner.py"' | xargs uv run python scripts/run-tests.py --only
      - name: Harness hook tests
        # In `rest` only, and whatever the application suite said. pytest's testpaths
        # excludes these, and they are stdlib-only by contract. A junit file, because
        # this step never reaches `run-tests.py`, which writes `logs/test-failures.log`:
        # without it a red hook suite uploads nothing a fixer can read.
        if: ${{ !cancelled() && matrix.shard == 'rest' && steps.env.outcome == 'success' }}
        run: uv run python -m pytest scripts/hooks/tests/ -q --junit-xml=logs/junit-hooks.xml
      - name: Upload test artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-failures-${{ matrix.shard }}
          path: |
            logs/test-failures.log
            logs/junit-hooks.xml
          if-no-files-found: ignore

  e2e:
    name: E2E
    # The default branch only: PRs merge without waiting for a gate, so a PR run of this
    # would decide nothing. After `Lint`, whatever it said, so a push run does not take a
    # fourth runner at once. A burst of merges collapses to the newest commit; the older
    # run's conclusion is then `cancelled`, which the fix trigger reads as no verdict
    # rather than a red. A red here is a red `PR Gate` on the default branch, which is
    # what the fix pass reads.
    needs: lint
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-e2e-${{ github.ref }}
      cancel-in-progress: true
    env:
      # What devkit's scheduler sets: under it a skip in the tier is a failure.
      DEVKIT_E2E: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"
      - name: Google Chrome
        # The scrape launches the installed Chrome (`BROWSER_CHANNEL=chrome`), which the
        # ubuntu-latest image ships; no Playwright browser download is needed. Printed so
        # an image that dropped it fails here, by name.
        run: google-chrome --version
      - name: End-to-end tier
        run: uv run python scripts/e2e.py --ci
      - name: Upload e2e artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failures
          path: logs/e2e-junit.xml
          if-no-files-found: ignore
