# The European cups have no teams of their own on Wikidata: their clubs are the
# domestic leagues', which `covers` brings into a cup post's context.
[[league]]
key = "ucl"
name = "UEFA Champions League"
sport = "soccer"
subreddits = ["championsleague"]
covers = ["epl", "laliga", "seriea", "bundesliga", "ligue1", "eredivisie", "primeira"]
x_queries = ['"Champions League" (lineup OR "team news" OR injury) min_faves:50']

[[league]]
key = "uel"
name = "UEFA Europa League"
sport = "soccer"
subreddits = ["soccer"]
covers = ["epl", "laliga", "seriea", "bundesliga", "ligue1", "eredivisie", "primeira"]

