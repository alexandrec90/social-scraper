# Leagues the sports domain covers: what Mise-o-jeu+ offers, maintained by hand.
#
# Field reference: `social_scraper/sports/leagues.py`. In short, each league names where
# its chatter lives (`subreddits`, `x_queries`) and where its teams and athletes come
# from (`wikidata` for a team league, `athletes` for an individual sport, `extra` for
# QIDs Wikidata's league data misses).
#
# Started from the Mise-o-jeu+ sport tree recorded on 2026-10-02 (sports_betting,
# docs/data-sources.md, "Scope collection to what Mise-o-jeu+ offers"). The `mise_o_jeu`
# labels are empty until `python scripts/check-leagues.py` has a coverage file to
# compare against -- it lists every Mise-o-jeu+ league with no entry here, in the
# `SPORT|League` form to paste.
#
# Wikidata ids were looked up live on 2026-10-04. Subreddit names have not been checked
# against Reddit: a wrong one costs a request per visit and shows up in
# logs/scrape-run.json as "not found".

# --- hockey ---------------------------------------------------------------------------

[[league]]
key = "nhl"
name = "NHL"
sport = "hockey"
wikidata = "Q1215892"
subreddits = ["nhl", "hockey"]
team_subreddits = true
x_queries = [
  '(NHL OR LNH) (injury OR lineup OR scratched OR "game-time decision") min_faves:20',
  '(LNH OR Canadien) (blessure OR alignement) lang:fr min_faves:10',
]

[[league]]
key = "khl"
name = "KHL"
sport = "hockey"
wikidata = "Q190001"
subreddits = ["KHL"]

[[league]]
key = "shl"
name = "SHL"
sport = "hockey"
wikidata = "Q392130"
subreddits = ["hockey"]

[[league]]
key = "liiga"
name = "Liiga"
sport = "hockey"
wikidata = "Q456107"
subreddits = ["Liiga"]

