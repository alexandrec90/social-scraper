# Leagues the sports domain covers: what Mise-o-jeu+ offers, maintained by hand.
#
# Field reference: `social_scraper/sports/leagues.py`. In short, each league names where
# its chatter lives (`subreddits`, `x_queries`) and where its teams and athletes come
# from (`wikidata` for a team league, `athletes` for an individual sport, `extra` for
# QIDs Wikidata's league data misses).
#
# Started from the Mise-o-jeu+ sport tree recorded on 2026-10-02 (sports_betting,
# docs/data-sources.md, "Scope collection to what Mise-o-jeu+ offers"). The `mise_o_jeu`
# labels are empty until `python scripts/check-leagues.py` has a coverage file to
# compare against -- it lists every Mise-o-jeu+ league with no entry here, in the
# `SPORT|League` form to paste.
#
# Wikidata ids were looked up live on 2026-10-04. Subreddit names have not been checked
# against Reddit: a wrong one costs a request per visit and shows up in
# logs/scrape-run.json as "not found".
#
# `polymarket_tags` were checked live on 2026-10-10: each returned open events from
# `gamma-api.polymarket.com/events?tag_slug=...` (EuroLeague, Eredivisie, Liga MX and the
# national-team competitions returned none, so they have no tags). `hfboards_forums`
# are the forum paths HFBoards' index listed on 2026-10-10.

# --- hockey ---------------------------------------------------------------------------

[[league]]
key = "nhl"
name = "NHL"
sport = "hockey"
wikidata = "Q1215892"
mise_o_jeu = ["ICE_HOCKEY|Etats-Unis / NHL"]
subreddits = ["nhl", "hockey"]
team_subreddits = true
x_queries = [
  '(NHL OR LNH) (injury OR lineup OR scratched OR "game-time decision") min_faves:20',
  '(LNH OR Canadien) (blessure OR alignement) lang:fr min_faves:10',
]
bluesky_queries = ["NHL injury", "NHL lineup", "LNH"]
polymarket_tags = ["nhl"]
hfboards_forums = [
  "national-hockey-league-talk.60",
  "trade-rumors-free-agent-talk.3",
  "sportsbook-hockey.171",
  "boston-bruins.15", "buffalo-sabres.18", "detroit-red-wings.34", "florida-panthers.28",
  "montreal-canadiens.16", "ottawa-senators.19", "tampa-bay-lightning.27",
  "toronto-maple-leafs.17",
  "carolina-hurricanes.26", "columbus-blue-jackets.31", "new-jersey-devils.20",
  "new-york-islanders.22", "new-york-rangers.24", "philadelphia-flyers.21",
  "pittsburgh-penguins.23", "washington-capitals.25",
  "chicago-blackhawks.30", "colorado-avalanche.35", "dallas-stars.44", "minnesota-wild.39",
  "nashville-predators.33", "st-louis-blues.32", "utah-mammoth.287", "winnipeg-jets.29",
  "anaheim-ducks.41", "calgary-flames.37", "edmonton-oilers.38", "los-angeles-kings.42",
  "san-jose-sharks.43", "seattle-kraken.275", "vancouver-canucks.36",
  "vegas-golden-knights.257",
]

