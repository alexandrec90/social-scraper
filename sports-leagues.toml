# The European cups have no teams of their own on Wikidata: their clubs are the
# domestic leagues', which `covers` brings into a cup post's context.
[[league]]
key = "ucl"
name = "UEFA Champions League"
sport = "soccer"
subreddits = ["championsleague"]
covers = ["epl", "laliga", "seriea", "bundesliga", "ligue1", "eredivisie", "primeira"]
x_queries = ['"Champions League" (lineup OR "team news" OR injury) min_faves:50']
polymarket_tags = ["ucl"]

[[league]]
key = "uel"
name = "UEFA Europa League"
sport = "soccer"
subreddits = ["soccer"]
covers = ["epl", "laliga", "seriea", "bundesliga", "ligue1", "eredivisie", "primeira"]
polymarket_tags = ["uel"]

# National-team soccer. National teams carry no "league" claim on Wikidata, so these
# have no team list: their posts are crawled and stored, players resolve through the
# club leagues they `cover`, and country names ("France") are not matched.
[[league]]
key = "nations_league"
name = "UEFA Nations League"
sport = "soccer"
mise_o_jeu = ["FOOTBALL|Européen / Ligue des nations de l'UEFA"]
subreddits = ["soccer"]
covers = ["epl", "laliga", "seriea", "bundesliga", "ligue1", "eredivisie", "primeira"]

[[league]]
key = "intl_friendlies"
name = "International friendlies"
sport = "soccer"
mise_o_jeu = ["FOOTBALL|Monde / Amicaux internationaux"]
subreddits = ["soccer"]
covers = ["epl", "laliga", "seriea", "bundesliga", "ligue1", "eredivisie", "primeira", "mls", "ligamx"]

# --- individual sports ----------------------------------------------------------------
# Top athletes of the sport by Wikipedia coverage, born in the last 40 years.

[[league]]
key = "atp"
name = "ATP Tour (incl. Challenger)"
sport = "tennis"
athletes = { sport = "Q847", sex = "Q6581097", limit = 200 }
subreddits = ["tennis"]
x_queries = ['ATP (withdraws OR retired OR injury OR "walkover") min_faves:30']
