[project]
name = "social-scraper"
version = "0.1.0"
description = "Browser-driven social ingestion (Reddit, X, StockTwits, TradingView, HFBoards, Bluesky, Polymarket) into data-lake"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pyarrow>=17.0",
  "duckdb>=1.1",
  # DuckDB converts a TIMESTAMPTZ to a Python datetime through pytz but does not declare
  # it, so without this the lens raises on any query that selects `created_at`.
  "pytz>=2024.1",
  "boto3>=1.35",
  "pydantic-settings>=2.4",
  # Drives a real, logged-in Chrome profile. Reddit answers a plain HTTP client with 403
  # and X has no read API we can use, so a browser is the only transport that works.
  "playwright>=1.50",
  # Reads the Pushshift / Arctic Shift Reddit dumps (`reddit_import.py`). They are
  # compressed with a 2 GiB window, which needs `max_window_size`; pyarrow's codec
  # exposes no such knob.
  "zstandard>=0.23",
]

[project.scripts]
social-scraper = "social_scraper.cli:main"

[project.optional-dependencies]
# Host-only toolchain. Deliberately NOT installed into the container image — it is
# several hundred MB of tooling the runtime never imports.
dev = [
  "ruff>=0.15",
  "mypy>=1.11",
  "pytest>=9.1",
  "pytest-cov>=5.0",
  # Runs `.pre-commit-config.yaml` — the commit-time gate. Installed here (not globally)
  # so the version is pinned with everything else, and so `session-start.sh` can wire the
  # git hook right after `uv sync` without a separate bootstrap step.
  "pre-commit>=4.6",
  # An in-process S3 for the lake export's tests: real boto3 requests and error codes,
  # no network and no bucket credentials.
  "moto[s3]>=5.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
# `testpaths` is what keeps `scripts/hooks/tests/` out of the application suite —
# those are the vendored harness's own stdlib-only tests and run separately.
testpaths = ["tests/"]
addopts = "-p devkit_temproot"
pythonpath = ["scripts/pytest-plugins"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
# The vendored agent harness is byte-identical upstream code (devkit owns its typing,
# and `sync-devkit.py --check` fails if this repo edits it). Type-checking it here
# only produces errors this repo is not allowed to fix.
exclude = '^scripts/(hooks/|sync-harness\.py)'

# pyarrow ships no type information (no stubs, no py.typed), so every import of it is
# `import-untyped`. Declared once here rather than suppressed at each import.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

# boto3 and botocore ship no type information either; their clients are generated at
# runtime, so `archive/store.py` types the client as `Any` rather than pull in stubs.
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true
