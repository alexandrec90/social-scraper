# The local stack.
#
# EVERY published port is a `${*_HOST_PORT:-<conventional default>}` variable, never
# a literal. That is what lets a parallel `git worktree` bring up a second stack
# without editing this file: it sets the offsets in its own `.env`. A hardcoded port
# here is the bug that makes two checkouts un-runnable at the same time — the
# defaults exist so a bare clone with no `.env` still works.
#
# Containers, network, and volumes are namespaced by COMPOSE_PROJECT_NAME (set in
# `.env`, and it must equal the checkout's directory name).

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-social_scraper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-social_scraper_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-social_scraper}
    ports:
      # Loopback only: the db is for this host. Another PC reaches it, if ever, through
      # `tailscale serve` (tailnet only), as ibkr_trader's is, never the LAN.
      - "127.0.0.1:${DB_HOST_PORT:-5434}:5432"
    volumes:
      # postgres:18 keeps its data under a versioned subdirectory and refuses to start
      # when a volume is mounted at the old `/var/lib/postgresql/data` path -- the
      # container comes up "unhealthy" with a pg_upgrade notice. Mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # Other services wait on this, so `up -d` returning means the DB is actually
      # accepting connections — not merely that the container started.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-social_scraper}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m

volumes:
  pgdata:
